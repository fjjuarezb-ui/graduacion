<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Botellas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f0;min-height:100vh;color:#1a1a1a}
.container{max-width:480px;margin:0 auto;padding:1.25rem}
.hidden{display:none!important}

.scan-card{background:#fff;border-radius:16px;padding:2rem 1.5rem;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-top:2rem}
.icon-circle{width:80px;height:80px;border-radius:50%;background:#E1F5EE;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:38px}
.scan-title{font-size:22px;font-weight:700;margin-bottom:4px}
.scan-sub{font-size:14px;color:#666;margin-bottom:1.25rem}
.badge{display:inline-block;padding:5px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:1.25rem}
.badge-ok{background:#E1F5EE;color:#085041}
.badge-used{background:#E6F1FB;color:#042C53}
.btn-open{background:#0F6E56;color:#fff;border:none;border-radius:10px;padding:14px 0;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:4px}
.msg-small{font-size:13px;color:#666;margin-top:10px}

.exp-box{background:#FAECE7;border:1px solid #F0997B;border-radius:12px;padding:2rem;text-align:center;margin-top:2rem}
.exp-box h2{color:#4A1B0C;font-size:20px;margin-bottom:8px}
.exp-box p{color:#993C1D;font-size:14px}

.dash-header{background:#0F6E56;color:#fff;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1rem}
.dash-header h1{font-size:18px;font-weight:700}
.dash-header p{font-size:13px;opacity:.8;margin-top:2px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.metric{background:#fff;border-radius:10px;padding:1rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.metric-label{font-size:12px;color:#666;margin-bottom:4px}
.metric-value{font-size:26px;font-weight:700}
.green{color:#0F6E56}
.prog-bg{background:#ddd;border-radius:99px;height:8px;margin-bottom:4px}
.prog-fill{background:#0F6E56;border-radius:99px;height:8px;transition:width .5s}
.prog-label{font-size:12px;color:#666;text-align:right;margin-bottom:1rem}

.section{margin-bottom:10px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec-header{display:flex;align-items:center;gap:10px;padding:.875rem 1rem;border-bottom:1px solid #f0f0f0}
.sec-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sec-title{font-size:14px;font-weight:700;flex:1;color:#1a1a1a}
.sec-stat{font-size:12px;color:#666;margin-right:6px}
.sec-pct{font-size:13px;font-weight:700}
.sec-prog-wrap{padding:6px 1rem 10px}
.sec-prog-bg{background:#eee;border-radius:99px;height:5px}
.sec-prog-fill{border-radius:99px;height:5px;transition:width .6s}
.bottles-row{display:flex;flex-wrap:wrap;gap:5px;padding:4px 1rem 12px}
.bcell{width:30px;height:30px;border-radius:7px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#aaa;background:#fff;font-weight:600}
.bcell.open{color:white;border-color:transparent}

.reset-btn{margin-top:1rem;background:none;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:12px;color:#aaa;cursor:pointer;width:100%}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<div id="screen-scan" class="container hidden">
  <div class="scan-card">
    <div class="icon-circle" id="si-icon">🍾</div>
    <div class="scan-title">Botella <span id="si-num">#?</span></div>
    <div class="scan-sub">Graduación Isabella · <span id="si-date"></span></div>
    <div><span class="badge badge-ok" id="si-badge">Disponible</span></div>
    <div id="si-action"></div>
  </div>
</div>

<div id="screen-exp" class="container hidden">
  <div class="exp-box">
    <div style="font-size:40px;margin-bottom:12px">⏰</div>
    <h2>QR Expirado</h2>
    <p>Este código ya no es válido.<br>El evento de 7 días ha concluido.</p>
  </div>
</div>

<div id="screen-dash" class="container hidden">
  <div class="dash-header">
    <h1>🎓 Graduación Isabella Juárez</h1>
    <p id="dash-date"></p>
  </div>
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total botellas</div><div class="metric-value">80</div></div>
    <div class="metric"><div class="metric-label">Abiertas</div><div class="metric-value green" id="m-open">0</div></div>
    <div class="metric"><div class="metric-label">Disponibles</div><div class="metric-value" id="m-avail">80</div></div>
    <div class="metric"><div class="metric-label">Consumo</div><div class="metric-value" id="m-pct">0%</div></div>
  </div>
  <div class="prog-bg"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="prog-label" id="prog-lbl">0 de 80 abiertas</div>
  <div id="sections"></div>
  <button class="reset-btn" onclick="resetAll()">↺ Reiniciar datos del evento</button>
</div>

<script>
var LICORES = [
  {name:'Whisky',        emoji:'🥃', range:[1,15],  color:'#C97A1A', bg:'#FAEEDA'},
  {name:'Tequila',       emoji:'🍹', range:[16,30], color:'#0F6E56', bg:'#E1F5EE'},
  {name:'Ron',           emoji:'🍺', range:[31,40], color:'#533AB7', bg:'#EEEDFE'},
  {name:'Vodka',         emoji:'🍸', range:[41,46], color:'#185FA5', bg:'#E6F1FB'},
  {name:'Vino Barefoot', emoji:'🍷', range:[47,50], color:'#993556', bg:'#FBEAF0'},
  {name:'Prosecco',      emoji:'🥂', range:[51,80], color:'#3B6D11', bg:'#EAF3DE'},
];
var TOTAL = 80;
var DAYS  = 7;
var KEY   = 'grad_v3';

function loadState(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function saveState(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}

var state = loadState();
if(!state||!state.created){state={created:Date.now(),opened:{},log:[]};saveState(state);}

function fmt(ts){try{return new Date(ts).toLocaleString('es-HN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return new Date(ts).toLocaleString();}}
function today(){try{return new Date().toLocaleDateString('es-HN',{day:'2-digit',month:'long',year:'numeric'});}catch(e){return new Date().toLocaleDateString();}}

function show(id){
  var ids=['screen-scan','screen-exp','screen-dash'];
  for(var i=0;i<ids.length;i++){
    var el=document.getElementById(ids[i]);
    if(el) el.className='container'+(ids[i]===id?'':' hidden');
  }
}

function refreshDash(){
  var totalOpen=Object.keys(state.opened).length;
  var pct=Math.round(totalOpen/TOTAL*100);
  document.getElementById('m-open').textContent=totalOpen;
  document.getElementById('m-avail').textContent=TOTAL-totalOpen;
  document.getElementById('m-pct').textContent=pct+'%';
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-lbl').textContent=totalOpen+' de '+TOTAL+' abiertas';

  var html='';
  for(var i=0;i<LICORES.length;i++){
    var L=LICORES[i];
    var start=L.range[0],end=L.range[1];
    var total=end-start+1;
    var opened=0;
    for(var n=start;n<=end;n++) if(state.opened[n]) opened++;
    var lpct=Math.round(opened/total*100);
    var cells='';
    for(var n=start;n<=end;n++){
      var isOpen=!!state.opened[n];
      var style=isOpen?'background:'+L.color+';':'';
      cells+='<div class="bcell'+(isOpen?' open':'')+'" style="'+style+'" title="Botella #'+n+'">'+n+'</div>';
    }
    html+='<div class="section">';
    html+='<div class="sec-header">';
    html+='<div class="sec-icon" style="background:'+L.bg+'">'+L.emoji+'</div>';
    html+='<div class="sec-title">'+L.name+'</div>';
    html+='<div class="sec-stat">'+opened+'/'+total+'</div>';
    html+='<div class="sec-pct" style="color:'+L.color+'">'+lpct+'%</div>';
    html+='</div>';
    html+='<div class="sec-prog-wrap"><div class="sec-prog-bg"><div class="sec-prog-fill" style="width:'+lpct+'%;background:'+L.color+'"></div></div></div>';
    html+='<div class="bottles-row">'+cells+'</div>';
    html+='</div>';
  }
  document.getElementById('sections').innerHTML=html;
}

function doOpen(n){
  state.opened[n]=Date.now();
  state.log.push({b:n,ts:Date.now()});
  saveState(state);
  document.getElementById('si-icon').textContent='✅';
  document.getElementById('si-icon').style.background='#0F6E56';
  var badge=document.getElementById('si-badge');
  badge.className='badge badge-ok pop';
  badge.textContent='¡Registrada!';
  var t=new Date().toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('si-action').innerHTML='<p class="msg-small">Registrada a las '+t+'</p>';
}

function resetAll(){
  if(confirm('¿Reiniciar todos los registros? No se puede deshacer.')){
    state={created:Date.now(),opened:{},log:[]};
    saveState(state);
    refreshDash();
  }
}

function route(){
  var p=new URLSearchParams(window.location.search);
  var b=parseInt(p.get('b'));
  var t=parseInt(p.get('t'));
  if(b&&t){
    show('screen-scan');
    document.getElementById('si-num').textContent='#'+b;
    document.getElementById('si-date').textContent=today();
    if((Date.now()-t)>DAYS*86400000){show('screen-exp');return;}
    var badge=document.getElementById('si-badge');
    var action=document.getElementById('si-action');
    if(state.opened[b]){
      badge.className='badge badge-used';
      badge.textContent='Ya registrada';
      action.innerHTML='<p class="msg-small">Abierta el '+fmt(state.opened[b])+'</p>';
    } else {
      badge.className='badge badge-ok';
      badge.textContent='Disponible';
      action.innerHTML='<button class="btn-open" onclick="doOpen('+b+')">Registrar apertura</button>';
    }
    return;
  }
  show('screen-dash');
  document.getElementById('dash-date').textContent=today();
  refreshDash();
}

route();
</script>
</body>
</html>
